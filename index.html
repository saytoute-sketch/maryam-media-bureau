<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتب مريم ميديا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* VOICE  playful game: the founder peeks at his team like a pixel-art management sim
   IDEA   floating isometric islands, one workshop per agent, the shared brain in the middle
   PICTURE a pixel canvas: 8 islands joined by wooden bridges, characters at desks, live states
   COLOUR sky blue, grass green, earth brown; each workshop has its own accent; glass UI panels
   TYPE   Press Start 2P for island signs, Baloo Bhaijaan 2 for Arabic UI
   LAYOUT glass top bar, the scene full width (scrolls sideways on phones), detail card + task board below */
:root{color-scheme:light;--ink:#1d2433;--soft:#5b6478;--glass:rgba(255,255,255,.78);--edge:rgba(255,255,255,.95);--sh:0 6px 24px rgba(30,60,110,.18)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:linear-gradient(#9fd3ff,#d9f0ff 60%,#eef8ff);color:var(--ink);font:16px/1.55 "Baloo Bhaijaan 2",Tahoma,sans-serif;overflow-x:clip;min-height:100vh}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:14px max(3vw,16px) 6px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--glass);border:1.5px solid var(--edge);border-radius:18px;padding:6px 10px;box-shadow:var(--sh);backdrop-filter:blur(10px)}
.brand{font-weight:800;font-size:clamp(20px,4vw,28px);line-height:1.1;padding-inline:6px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:#2ec4a6;box-shadow:0 0 0 3px rgba(46,196,166,.25)}
.tab{border-radius:12px;padding:2px 12px;font-weight:700;white-space:nowrap}
.tab.on{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.n{display:inline-block;min-width:22px;text-align:center;border-radius:8px;padding:0 6px;margin-inline-start:4px;font-size:14px;color:#fff}
.stage{direction:ltr;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding:0 0 6px}
.world{position:relative;margin:0 auto;width:max(100%,720px);max-width:1240px}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges}
.sign{position:absolute;transform:translate(-50%,-100%);font:clamp(7px,.9vw,10px)/1 "Press Start 2P",monospace;color:#3b1d00;background:#ffb03a;border:2px solid #3b1d00;padding:5px 6px 4px;white-space:nowrap;box-shadow:0 3px 0 #3b1d00;cursor:pointer}

.chip{position:absolute;transform:translate(-50%,0);direction:rtl;display:flex;align-items:center;gap:6px;background:var(--glass);border:1.5px solid var(--edge);border-radius:12px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:var(--sh);cursor:pointer;backdrop-filter:blur(6px)}
.chip i{width:9px;height:9px;border-radius:50%;flex:none}
.below{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;padding:8px max(3vw,16px) 28px;max-width:1240px;margin:0 auto}
.card{background:var(--glass);border:1.5px solid var(--edge);border-radius:20px;padding:14px 16px;box-shadow:var(--sh);backdrop-filter:blur(10px)}
.card h2{margin:0;font-size:26px;line-height:1.1}
.card .fr{color:var(--soft);font-size:14px;direction:ltr;text-align:right}
.st{display:inline-block;margin:8px 0;border-radius:10px;padding:1px 10px;font-weight:700;color:#fff}
.ttl{direction:ltr;text-align:left;margin:4px 0 0;line-height:1.35}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.col h3{margin:0 0 8px;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.col ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.col li{background:#fff;border-radius:12px;padding:6px 10px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.col li p{margin:0;direction:ltr;text-align:left;font-size:14px;line-height:1.35}
.col li span{font-size:13px;color:var(--soft)}
.muted{color:var(--soft);font-size:14px;margin:0}
.hint{font-size:13px;color:var(--soft);margin:10px 0 0}
.c-work{background:#2ec4a6}.c-wait{background:#ff5fa2}.c-todo{background:#f0a400}.c-idle{background:#8a93a6}
@media(max-width:860px){.below{grid-template-columns:minmax(0,1fr)}.board{grid-template-columns:minmax(0,1fr)}}
@media(max-width:600px){.chip{font-size:12px;padding:1px 8px}}
</style>
</head>
